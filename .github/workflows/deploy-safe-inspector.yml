name: Deploy safe bcrypt inspector
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload safe inspector
        uses: actions/upload-pages-artifact@v4
        with:
          path: inspector
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
